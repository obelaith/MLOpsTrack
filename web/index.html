
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MLOpsTrack</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            margin: 40px auto;
            max-width: 1000px;
            padding: 0 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee;
        }

        #message {
            color: #666;
        }
    </style>
</head>
<body>
    <h1>MLOpsTrack</h1>
    <h2>Experiments</h2>

    <p id="message">Loading experiments...</p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Created</th>
            </tr>
        </thead>
        <tbody id="experiments"></tbody>
    </table>

    <script>
        async function loadExperiments() {
            const table = document.getElementById("experiments");
            const message = document.getElementById("message");

            try {
                const response = await fetch("/experiments");

                if (!response.ok) {
                    throw new Error("Failed to load experiments");
                }

                const experiments = await response.json();
                message.textContent = "";

                if (experiments.length === 0) {
                    message.textContent = "No experiments yet.";
                    return;
                }

                for (const experiment of experiments) {
                    const row = table.insertRow();

                    const values = [
                        experiment.id,
                        experiment.name,
                        experiment.description || "-",
                        new Date(experiment.created_at).toLocaleString()
                    ];

                    for (const value of values) {
                        row.insertCell().textContent = value;
                    }
                }
            } catch (error) {
                message.textContent = error.message;
            }
        }

        loadExperiments();
    </script>
</body>
</html>
