
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MLOpsTrack</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            margin: 40px auto;
            max-width: 1000px;
            padding: 0 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee;
        }

        #message {
            color: #666;
        }


        
        #experiments tr, #runs tr {
            cursor: pointer;
        }

        #experiments tr:hover, #runs tr:hover {
            background: #eee;
        }


    </style>
</head>
<body>
    <h1>MLOpsTrack</h1>
    <h2>Experiments</h2>

    <p id="message">Loading experiments...</p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Created</th>
            </tr>
        </thead>
        <tbody id="experiments"></tbody>
    </table>


<section id="runs-section" hidden>
    <h2 id="runs-title">Runs</h2>

    <p id="runs-message"></p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Status</th>
                <th>Started</th>
                <th>Finished</th>
            </tr>
        </thead>
        <tbody id="runs"></tbody>
    </table>
</section>


<section id="details-section" hidden>
    <h2 id="details-title">Run Details</h2>
    <p id="details-message"></p>

    <h3>Parameters</h3>
    <table>
        <thead>
            <tr>
                <th>Key</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody id="params"></tbody>
    </table>
    <p id="params-message"></p>

    <h3>Metrics</h3>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Step</th>
                <th>Value</th>
                <th>Recorded</th>
            </tr>
        </thead>
        <tbody id="metrics"></tbody>
    </table>
    <p id="metrics-message"></p>
</section>



    <script>


        let selectedRunId = null;

        async function loadRunDetails(run) {
            selectedRunId = run.id;

            const section = document.getElementById("details-section");
            const title = document.getElementById("details-title");
            const message = document.getElementById("details-message");
            const paramsTable = document.getElementById("params");
            const metricsTable = document.getElementById("metrics");
            const paramsMessage = document.getElementById("params-message");
            const metricsMessage = document.getElementById("metrics-message");




            section.hidden = false;
            title.textContent = "Run Details - " + run.name;
            message.textContent = "Loading...";
            paramsTable.replaceChildren();
            metricsTable.replaceChildren();
            paramsMessage.textContent = "";
            metricsMessage.textContent = "";

            try {
                const [paramsResponse, metricsResponse] = await Promise.all([
                    fetch(`/params?run_id=${run.id}`),
                    fetch(`/metrics?run_id=${run.id}`)
                ]);

                if (!paramsResponse.ok || !metricsResponse.ok) {
                    throw new Error("Failed to load run details");
                }

                const params = await paramsResponse.json();
                const metrics = await metricsResponse.json();

                if (selectedRunId !== run.id) return;

                message.textContent = "";

                for (const param of params) {
                    const row = paramsTable.insertRow();
                    row.insertCell().textContent = param.key;
                    row.insertCell().textContent = param.value;
                }

                for (const metric of metrics) {
                    const row = metricsTable.insertRow();
                    row.insertCell().textContent = metric.name;
                    row.insertCell().textContent = metric.step;
                    row.insertCell().textContent = metric.value;
                    row.insertCell().textContent =
                        new Date(metric.recorded_at).toLocaleString();
                }

                if (params.length === 0) {
                    paramsMessage.textContent = "No parameters logged.";
                }

                if (metrics.length === 0) {
                    metricsMessage.textContent = "No metrics logged.";
                }
            } catch (error) {
                if (selectedRunId === run.id) {
                    message.textContent = error.message;
                }
            }
        }



        async function loadRuns(experiment) {

            selectedRunId = null;
            document.getElementById("details-section").hidden = true;
            
            const section = document.getElementById("runs-section");
            const title = document.getElementById("runs-title");
            const table = document.getElementById("runs");
            const message = document.getElementById("runs-message");

            section.hidden = false;
            title.textContent = "Runs - " + experiment.name;
            table.replaceChildren();
            message.textContent = "Loading runs...";

            try {
                const response = await fetch(
                    `/runs?experiment_id=${experiment.id}`
                );

                if (!response.ok) {
                    throw new Error("Failed to load runs");
                }

                const runs = await response.json();
                message.textContent = "";

                if (runs.length === 0) {
                    message.textContent = "No runs yet.";
                    return;
                }

                for (const run of runs) {
                    const row = table.insertRow();

                    row.addEventListener("click", () => loadRunDetails(run));

                    const values = [
                        run.id,
                        run.name,
                        run.status,
                        new Date(run.started_at).toLocaleString(),
                        run.finished_at
                            ? new Date(run.finished_at).toLocaleString()
                            : "-"
                    ];

                    for (const value of values) {
                        row.insertCell().textContent = value;
                    }
                }
            } catch (error) {
                message.textContent = error.message;
            }
        }



        async function loadExperiments() {
            const table = document.getElementById("experiments");
            const message = document.getElementById("message");

            try {
                const response = await fetch("/experiments");

                if (!response.ok) {
                    throw new Error("Failed to load experiments");
                }

                const experiments = await response.json();
                message.textContent = "";

                if (experiments.length === 0) {
                    message.textContent = "No experiments yet.";
                    return;
                }

                for (const experiment of experiments) {
                    const row = table.insertRow();

                    row.addEventListener("click", () => loadRuns(experiment));

                    const values = [
                        experiment.id,
                        experiment.name,
                        experiment.description || "-",
                        new Date(experiment.created_at).toLocaleString()
                    ];

                    for (const value of values) {
                        row.insertCell().textContent = value;
                    }
                }
            } catch (error) {
                message.textContent = error.message;
            }
        }

        loadExperiments();
    </script>
</body>
</html>
